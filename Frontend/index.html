<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrepBot - AI Interview Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. Welcome Screen -->
  <div id="welcomeScreen">
    <h1>PrepBot</h1>
    <p>Enhance your interview with AI</p>
    <button id="startPracticeBtn">Start Practice</button>
  </div>

  <!-- 2. Role Selection Screen -->
  <div id="roleScreen" class="hidden">
    <h2>Select Your Role</h2>
    
    <label for="roleDropdown">Role:</label>
    <select id="roleDropdown">
      <option value="" disabled selected>Select a role...</option>
      
      <optgroup label="Technical">
        <option value="software_engineer">Software Engineer</option>
        <option value="frontend">Frontend</option>
        <option value="backend">Backend</option>
        <option value="full_stack">Full Stack</option>
        <option value="data_analyst">Data Analyst</option>
      </optgroup>
      
      <optgroup label="Business">
        <option value="product_manager">Product Manager</option>
        <option value="marketing">Marketing</option>
        <option value="sales">Sales</option>
      </optgroup>
      
      <optgroup label="Academic">
        <option value="teacher">Teacher</option>
        <option value="lecturer">Lecturer</option>
        <option value="professor">Professor</option>
        <option value="school_incharge">School Incharge</option>
      </optgroup>
      
      <optgroup label="Programs">
        <option value="google_ambassador">Google Student Ambassador</option>
        <option value="uipath_developer">UiPath Student Developer</option>
        <option value="microsoft_ambassador">Microsoft Student Ambassador</option>
        <option value="hackathon">Hackathon</option>
      </optgroup>
      
      <optgroup label="Custom">
        <option value="custom">Custom role</option>
      </optgroup>
    </select>

    <!-- Hidden by default -->
    <input type="text" id="customRoleInput" class="hidden" placeholder="Enter your custom role">
    
    <!-- Error Message Placeholder -->
    <p id="roleErrorMessage"></p>
    
    <button id="startInterviewBtn">Start Interview</button>
  </div>

  <!-- 3. Interview Mode Selection Screen -->
  <div id="modeScreen" class="hidden">
    <h2>Select Interview Mode</h2>
    <p>Role: <span id="modeSelectedRole"></span></p>
    
    <button id="chatModeBtn">Chat Mode</button>
    <button id="voiceModeBtn">Voice Mode</button>
  </div>

  <!-- 4. Interview Screen -->
  <div id="interviewScreen" class="hidden">
    <h2>Interview in Progress</h2>
    
    <p id="progressIndicator">Question 1 of 5</p>
    <p id="questionText">Question text will appear here...</p>
    
    <!-- Text area for chat mode -->
    <textarea id="answerTextarea" rows="5" placeholder="Type your answer here..."></textarea>
    
    <!-- Voice button for voice mode -->
    <button id="voiceAnswerBtn" class="hidden">Start Voice Recording</button>
    
    <button id="nextQuestionBtn">Next Question</button>
    
    <!-- Feedback Section -->
    <div id="feedbackSection">
      <h3>Feedback</h3>
      <p>Score: <span id="feedbackScore"></span></p>
      
      <h4>Strengths</h4>
      <ul id="feedbackStrengths"></ul>
      
      <h4>Improvements</h4>
      <ul id="feedbackImprovements"></ul>
    </div>
  </div>

  <!-- 5. Session Summary Screen -->
  <div id="summaryScreen" class="hidden">
    <h2>Interview Completed</h2>
    
    <p>Average Score: <span id="summaryAverageScore"></span></p>
    
    <h3>Strengths</h3>
    <ul id="summaryStrengths"></ul>
    
    <h3>Improvements</h3>
    <ul id="summaryImprovements"></ul>
    
    <button id="practiceAgainBtn">Practice Again</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
